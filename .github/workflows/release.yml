name: release

# 打 tag（v*）自动出双端产物并建 Release；也可手动触发（只出产物不发布）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read # report job 需要读失败步骤日志（gh run view --log-failed）

jobs:
  # ------------------------------------------------------------------ 桌面端
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            script: build:win:x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 校验品牌层（幂等，上游改动导致规则失效时会报错）
        run: node tools/rebrand.mjs

      # 注意顺序：上游的 postinstall 会在安装期触发 native-keymap 的编译，而它要求 VS 的
      # Spectre 缓解库（Runner 不保证有）。因此先 --ignore-scripts 安装，再把二进制与补丁
      # 按顺序补上：Electron 二进制 -> 上游 patch-package -> 关闭 Spectre 要求 -> 构建
      # （构建脚本内部会执行 electron-rebuild，为 Electron ABI 重编原生模块）。
      - name: 安装依赖（跳过 build scripts）
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: 下载 Electron 二进制
        working-directory: desktop
        run: pnpm rebuild electron

      - name: 应用上游 patch-package 补丁（native-keymap C++20 等）
        working-directory: desktop/packages/desktop
        run: pnpm exec patch-package

      - name: 关闭 native-keymap 的 Spectre 库要求
        run: node tools/patch-native-keymap.mjs

      - name: 构建并打包
        working-directory: desktop
        run: pnpm ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: inkmark-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  # ------------------------------------------------------------------ 安卓端
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: android/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8 的 sourceCompatibility 为 21

      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 安装依赖
        working-directory: android
        run: pnpm install --no-frozen-lockfile

      - name: 构建 Web 产物并同步
        working-directory: android
        run: pnpm run android:sync

      # 仓库从 Windows 提交，gradlew 的 +x 位会丢失，Linux runner 上必须补回
      - name: 修正 gradlew 可执行权限
        run: chmod +x android/android/gradlew

      - name: 准备签名（存在 keystore secret 时启用正式签名）
        if: ${{ github.event_name == 'push' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/inkmark.jks"
            echo "HAS_KEYSTORE=1" >> "$GITHUB_ENV"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，将只产出 debug 包"
          fi

      - name: 构建 debug APK
        working-directory: android/android
        run: ./gradlew assembleDebug

      - name: 构建签名的 release APK
        if: ${{ env.HAS_KEYSTORE == '1' && github.event_name == 'push' }}
        working-directory: android/android
        env:
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/inkmark.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: inkmark-android
          path: android/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ 发布
  publish:
    name: publish release
    needs: [desktop, android]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物与校验和
        run: |
          mkdir -p release
          cp artifacts/inkmark-windows-x64/*.exe      release/ 2>/dev/null || true
          cp artifacts/inkmark-windows-x64/*.zip      release/ 2>/dev/null || true
          cp artifacts/inkmark-windows-x64/*.blockmap release/ 2>/dev/null || true
          cp artifacts/inkmark-windows-x64/latest.yml release/ 2>/dev/null || true

          REL=$(find artifacts/inkmark-android -path '*apk/release/*.apk' | head -1)
          DBG=$(find artifacts/inkmark-android -path '*apk/debug/*.apk' | head -1)
          [ -n "$REL" ] && cp "$REL" "release/InkMark-${GITHUB_REF_NAME}-android.apk"
          [ -n "$DBG" ] && cp "$DBG" "release/InkMark-${GITHUB_REF_NAME}-android-debug.apk"

          ls -la release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 非正式版本（含 -rc/-alpha/-beta）自动标记为 pre-release，避免自更新误推
          PRE=""
          case "$GITHUB_REF_NAME" in
            *-rc*|*-alpha*|*-beta*) PRE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "InkMark $GITHUB_REF_NAME" \
            --generate-notes $PRE \
            release/*

  # ------------------------------------------------------------------ 状态回写
  # 仓库为私有，外部无法读取 Actions 运行状态；把结果写到一个分支便于脚本化查看：
  #   git ls-remote origin refs/heads/ci-status   /   git fetch origin ci-status
  report:
    name: report status
    needs: [desktop, android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 写 ci-status 分支
        env:
          DESKTOP: ${{ needs.desktop.result }}
          ANDROID: ${{ needs.android.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin ci-status || true
          git checkout -B ci-status origin/ci-status 2>/dev/null || git checkout -B ci-status
          mkdir -p .ci
          cat > .ci/status.json <<EOF
          {
            "ref": "${GITHUB_REF_NAME}",
            "runId": "${GITHUB_RUN_ID}",
            "desktop": "${DESKTOP}",
            "android": "${ANDROID}",
            "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          printf '# CI 状态\n\n最近一次运行: %s\n\n- desktop: %s\n- android: %s\n- ref: %s\n' \
            "${GITHUB_RUN_ID}" "${DESKTOP}" "${ANDROID}" "${GITHUB_REF_NAME}" > .ci/README.md

          # 失败时把失败步骤的日志抓下来（私有仓库外部看不到 Actions 日志，这里是最快的排查通道）
          if [ "${DESKTOP}" != "success" ] || [ "${ANDROID}" != "success" ]; then
            gh run view "${GITHUB_RUN_ID}" --log-failed > .ci/failed.log 2>&1 || true
            echo "--- 失败日志尾部 ---"
            tail -c 8000 .ci/failed.log || true
          else
            rm -f .ci/failed.log
          fi

          git config user.name "inkmark-ci"
          git config user.email "ci@inkmark.local"
          git add -A .ci
          git commit -m "ci: ${GITHUB_REF_NAME} desktop=${DESKTOP} android=${ANDROID}" || echo "无变化"
          git push -f origin ci-status
